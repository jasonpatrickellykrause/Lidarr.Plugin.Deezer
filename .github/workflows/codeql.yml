name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # weekly, so new queries run against unchanged code too
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # no build needed; avoids compiling the Lidarr submodule just to scan the plugin
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
