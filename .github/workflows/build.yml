name: Build Plugin
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    # no release when a merge only touches docs or CI config; the plugin is unchanged, so Lidarr users would get an
    # update that does nothing. Pull requests still build, and a push that also changes code runs as normal.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.github/**'
      - 'build/**'
  pull_request:
  workflow_dispatch:

# read-only by default; only the release job can write
permissions:
  contents: read

env:
  # Stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Deezer
  # 10.2 keeps this fork's versions above TrevTV's 10.1.0.x releases
  PLUGIN_VERSION: 10.2.0.${{ github.run_number }}
  MINIMUM_LIDARR_VERSION: 3.0.0.4855
  DOTNET_VERSION: 8.0.405

jobs:
  build:
    strategy:
      matrix:
        framework: [ net8.0 ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Create global.json
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json
      - name: Generate metadata
        id: gen_meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" | tr '/' '-'  >> $GITHUB_OUTPUT
      - name: Update Version Info
        run: |
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$PLUGIN_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${{ steps.gen_meta.outputs.branch }}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
      - name: Build
        run: |
          dotnet restore src/*.sln -p:TreatWarningsAsErrors=false -p:CustomAfterMicrosoftCommonProps=${{ github.workspace }}/build/SubmoduleAudit.props
          dotnet build src/*.sln -c Release -f ${{ matrix.framework }} -p:TreatWarningsAsErrors=false -p:PluginRepository=${{ github.repository }} -p:CustomAfterMicrosoftCommonProps=${{ github.workspace }}/build/SubmoduleAudit.props
      - name: Test DeezNET
        # offline decryption tests only; the others call Deezer and compare against live data
        run: dotnet test ext/DeezNET/DeezNET.Tests -c Release --filter "FullyQualifiedName~DeezNET.Tests.DecryptionTests"
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}
          path: ./_plugins/net8.0/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # create releases one at a time so each changelog starts from the previous release's tag
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history and tags for the changelog
          fetch-depth: 0
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PLUGIN_NAME }}.net8.0
          path: plugin
      - name: Generate Changelog
        run: |
          echo "Changelog:" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0)..HEAD | awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt
          cat changelog.txt
      - name: Zip Plugin
        run: zip -j ${{ env.PLUGIN_NAME }}.net8.0.zip plugin/${{ env.PLUGIN_NAME }}.*
      - name: Attest build provenance
        # lets anyone check the zip came from this workflow: gh attestation verify <zip> --repo <owner>/<repo>
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PLUGIN_NAME }}.net8.0.zip
      - name: Tag the built commit
        # create the tag here so it lands on the commit that was built, not wherever main points by the time the release
        # is created; skipped on a re-run, when the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$PLUGIN_VERSION" > /dev/null; then
            echo "Tag $PLUGIN_VERSION already exists"
          else
            git tag "$PLUGIN_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$PLUGIN_VERSION"
          fi
      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          # Lidarr only offers releases whose target_commitish is main or master; the tag already exists (previous step),
          # so GitHub leaves it on the built commit and only records this branch name
          target_commitish: main
          name: ${{ env.PLUGIN_VERSION }}
          body_path: changelog.txt
          # published, not draft: Lidarr only sees published releases
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
