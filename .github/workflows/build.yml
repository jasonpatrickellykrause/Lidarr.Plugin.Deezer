name: Build Plugin
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

# read-only by default; only the release job can write
permissions:
  contents: read

env:
  # Stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Deezer
  # 10.2 keeps this fork's versions above TrevTV's 10.1.0.x releases
  PLUGIN_VERSION: 10.2.0.${{ github.run_number }}
  MINIMUM_LIDARR_VERSION: 3.0.0.4855
  DOTNET_VERSION: 8.0.405

jobs:
  build:
    strategy:
      matrix:
        framework: [ net8.0 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Create global.json
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json
      - name: Generate metadata
        id: gen_meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" | tr '/' '-'  >> $GITHUB_OUTPUT
      - name: Update Version Info
        run: |
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$PLUGIN_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${{ steps.gen_meta.outputs.branch }}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
      - name: Build
        run: |
          dotnet restore src/*.sln -p:TreatWarningsAsErrors=false
          dotnet build src/*.sln -c Release -f ${{ matrix.framework }} -p:TreatWarningsAsErrors=false
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}
          path: ./_plugins/net8.0/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history and tags for the changelog
          fetch-depth: 0
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PLUGIN_NAME }}.net8.0
          path: plugin
      - name: Generate Changelog
        run: |
          echo "Changelog:" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0)..HEAD | awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt
          cat changelog.txt
      - name: Zip Plugin
        run: zip -j ${{ env.PLUGIN_NAME }}.net8.0.zip plugin/${{ env.PLUGIN_NAME }}.*
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_VERSION }}
          body_path: changelog.txt
          # published, not draft: Lidarr only sees published releases
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
